[build-system]
# AVOID CHANGING REQUIRES: IT WILL BE UPDATED BY PYSCAFFOLD!
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factguard-generation"
version = "0.1.0"
authors = [
    { name = "The FactGuard Authors" },
]
description = "Data-generation and quality-control pipeline for FactGuard-Bench"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "aiohttp",
    "jsonlines",
    "openai>=1.30",
    "python-dotenv",
    "requests",
    "rich"
]

[project.optional-dependencies]
rag = [
    "faiss-cpu",
    "langchain-community",
    "langchain-text-splitters",
    "numpy",
    "tqdm",
]
debug = [
    "click",
    "fastapi",
    "gradio",
    "markdown",
    "uvicorn",
]


[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["src"]    # ["."] by default
include = ["*"]    # ["*"] by default
exclude = []       # empty by default
namespaces = false # true by default

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.ruff]

line-length = 88
